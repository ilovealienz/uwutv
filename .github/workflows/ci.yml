name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # use the version declared in go.mod, so CI tidies the module the
          # same way local builds do
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "not gofmt'd:"; echo "$unformatted"; exit 1
          fi

      - name: go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum || {
            echo "::error::go.mod/go.sum are out of date - run 'go mod tidy' and commit"
            exit 1
          }

      - name: vet
        run: go vet ./...

      - name: build
        env:
          CGO_ENABLED: 0
        run: go build ./...
